
services:
  db:
    image : postgres:16
    environment:
      POSTGRES_PASSWORD: "admin123"
      POSTGRES_USER: "postgres"
  main:
    build: 
      context: .
      dockerfile: "MainService/Dockerfile"
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Database=tasktrack;Username=postgres;Password=admin123;"
  Worker:
    build:
      context: .
      dockerfile: "WorkerService/Dockerfile"
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=db;Database=tasktrack;Username=postgres;Password=admin123;"
networks:
  default:
    name: tasktrackapp-net